spring.application.name=smart-procurement-system-backend

# Active profile
spring.profiles.active=local

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080

# JWT signing key must remain stable across application restarts.
jwt.secret=${JWT_SECRET:smart-procurement-system-jwt-secret-2026-change-this}

